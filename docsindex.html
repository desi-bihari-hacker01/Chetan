<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Voice Assistant</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 5px; }
  p.desc { color: #555; font-size: 0.95rem; }
  textarea {
    width: 100%;
    height: 90px;
    font-size: 1rem;
    padding: 10px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: vertical;
    margin-top: 15px;
  }
  button {
    margin-top: 15px;
    padding: 10px 25px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  p.note {
    margin-top: 30px;
    font-size: 0.85rem;
    color: #777;
  }
</style>
</head>
<body>

  <h1>Python Voice Assistant</h1>
  <p class="desc">A simple text-to-speech demo.</p>

  <textarea id="textInput">Good morning! Welcome to the Python Voice Assistant. How can I assist you today?</textarea>
  <br>
  <button onclick="speak()">Speak</button>
